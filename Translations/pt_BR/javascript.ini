mautic.producttour.button.next="Próximo"
mautic.producttour.button.back="Voltar"
mautic.producttour.button.finish="Concluir"
mautic.producttour.button.go_to_configuration="Ir para a configuração"
mautic.producttour.button.go_to_tracking_settings="Ir para as configurações de rastreamento"
mautic.producttour.button.go_to_contacts="Ir para os contatos"
mautic.producttour.dashboard.welcome.title="Bem-vindo ao Mautic"
mautic.producttour.dashboard.welcome.text="Este é o seu painel. Siga o tour para começar e aprender como os recursos funcionam."
mautic.producttour.dashboard.filter.title="Filtre os dados do painel"
mautic.producttour.dashboard.filter.text="Por padrão, o Mautic exibe dados dos últimos 30 dias, mas você pode alterar isso na configuração. A alteração vale para todos os widgets."
mautic.producttour.dashboard.widgets.title="Veja informações essenciais com widgets"
mautic.producttour.dashboard.widgets.text="Estes gráficos exibem seus dados. Assim que as informações começarem a ser coletadas, confira-os novamente."
mautic.producttour.dashboard.navigation.title="Navegue pelo Mautic"
mautic.producttour.dashboard.navigation.text="O menu principal permite acessar e explorar facilmente os vários recursos."
mautic.producttour.dashboard.tracking.title="Conecte o script de rastreamento"
mautic.producttour.dashboard.tracking.text="Para começar a coletar dados dos visitantes, abra a configuração e configure seu script de rastreamento."
mautic.producttour.configuration.visitor_tracking.title="Configure o rastreamento de visitantes"
mautic.producttour.configuration.visitor_tracking.text="Nesta página, você gerencia o funcionamento do Mautic. Primeiro, vamos garantir que os visitantes possam ser rastreados."
mautic.producttour.configuration.implement_tracking.title="Implemente o rastreamento no seu site"
mautic.producttour.configuration.implement_tracking.text="Copie este código e cole-o no final da tag body do seu site."
mautic.producttour.configuration.grow_list.title="Aumente sua lista"
mautic.producttour.configuration.grow_list.text="Quando as pessoas começarem a acessar seu site, você encontrará novos visitantes na página Contatos."
mautic.producttour.contacts.explore_database.title="Explore seu banco de contatos"
mautic.producttour.contacts.explore_database.text="Depois de implementar o código de rastreamento do Mautic, você poderá ver os visitantes identificados e não identificados que interagem com seu site. Importe seus contatos para preencher ou ampliar esta lista."
mautic.producttour.contacts.toggle_anonymous.title="Alterne os contatos anônimos"
mautic.producttour.contacts.toggle_anonymous.text="O Mautic cria visitantes não identificados com base no IP quando ainda não temos nome ou endereço de e-mail. Clique depois para alternar entre visitantes não identificados (contatos anônimos) e conhecidos (contatos)."
mautic.producttour.contacts.import.title="Importe seus contatos"
mautic.producttour.contacts.import.text="Clique no botão de seta para abrir o menu e escolha \"Importar\" para trazer leads rapidamente ou \"Histórico de importações\" para consultar importações anteriores."
mautic.producttour.segments.understand.title="Entenda a segmentação de contatos"
mautic.producttour.segments.understand.text="Os segmentos são usados para categorizar seus contatos em listas específicas com base em atributos, comportamento ou participação em campanhas."
mautic.producttour.segments.initiate_creation.title="Comece a criar um segmento"
mautic.producttour.segments.initiate_creation.text="Clique em \"Novo\" para adicionar um segmento. Por exemplo, você pode acompanhar contatos que visitaram a página de contato do seu site."
mautic.producttour.segments.internal_name.title="Defina o nome interno"
mautic.producttour.segments.internal_name.text="Ele ficará visível apenas para você e outros usuários do Mautic na página de segmentos."
mautic.producttour.segments.customer_facing_name.title="Defina o nome do segmento para os clientes"
mautic.producttour.segments.customer_facing_name.text="Use este campo para exibir outro nome aos contatos. Mais tarde, ele será útil no centro de preferências para gerenciar a participação no segmento."
mautic.producttour.segments.activate.title="Ative o segmento"
mautic.producttour.segments.activate.text="Defina o segmento como Ativo para usá-lo mais tarde."
mautic.producttour.segments.begin_setup.title="Comece a configurar o segmento"
mautic.producttour.segments.begin_setup.text="Ao adicionar filtros, você cria segmentos dinâmicos que adicionam e removem contatos automaticamente. Ignore esta etapa para mantê-lo estático."
mautic.producttour.segments.select_criteria.title="Selecione os critérios do segmento"
mautic.producttour.segments.select_criteria.text="Você pode filtrar com base em informações conhecidas e comportamento. Por exemplo, use \"URL visitada\" para adicionar contatos que acessaram uma página específica."
mautic.producttour.segments.combine_filters.title="Combine os filtros do segmento"
mautic.producttour.segments.combine_filters.text="Para vários filtros, selecione campos adicionais e defina se as expressões devem usar \"E\" ou \"OU\"."
mautic.producttour.segments.good_to_go.title="Tudo pronto"
mautic.producttour.segments.good_to_go.text="Você criou um segmento. Salve-o para concluir."
mautic.producttour.campaigns.welcome.title="Bem-vindo à central de campanhas"
mautic.producttour.campaigns.welcome.text="Aqui você gerencia e impulsiona seus processos de automação de marketing no Mautic."
mautic.producttour.emails.craft.title="Crie e-mails incríveis"
mautic.producttour.emails.craft.text="Aqui você pode criar, personalizar e acompanhar facilmente suas comunicações por e-mail."
mautic.producttour.messages.hub.title="Seu centro de mensagens multicanal"
mautic.producttour.messages.hub.text="Este é o seu espaço para criar e gerenciar mensagens de marketing personalizadas em vários canais. Organize o envio de SMS, e-mails, redes sociais e notificações push."
mautic.producttour.focus.capture_attention.title="Capte a atenção com itens de foco"
mautic.producttour.focus.capture_attention.text="Os itens de foco permitem criar pop-ups, modais e banners para chamar a atenção e incentivar ações como assinar uma newsletter ou preencher um formulário."
mautic.producttour.assets.manage.title="Gerencie seus recursos digitais"
mautic.producttour.assets.manage.text="Este é o centro para gerenciar todos os recursos digitais usados em suas campanhas de marketing."
mautic.producttour.forms.design.title="Crie ferramentas de coleta de dados"
mautic.producttour.forms.design.text="Aqui você pode criar e gerenciar formulários para coletar dados valiosos de clientes com eficiência."
mautic.producttour.landing_pages.create.title="Crie landing pages atraentes"
mautic.producttour.landing_pages.create.text="Aqui você pode criar, personalizar e otimizar landing pages. O editor intuitivo de arrastar e soltar do Mautic permite adicionar imagens, formulários e CTAs para captar leads e aumentar as conversões."
mautic.producttour.dynamic_content.personalize.title="Personalize seu conteúdo dinamicamente"
mautic.producttour.dynamic_content.personalize.text="Crie experiências personalizadas entregando conteúdo adaptado ao comportamento e às preferências do público. Personalize dinamicamente o conteúdo do site, e-mails e landing pages."
mautic.producttour.point_actions.automated_responses.title="Configure respostas automatizadas"
mautic.producttour.point_actions.automated_responses.text="Defina e automatize respostas às interações em suas campanhas, como e-mails de acompanhamento, ajustes de pontuação ou adição de contatos a segmentos."
mautic.producttour.point_triggers.configure.title="Configure seus gatilhos de marketing"
mautic.producttour.point_triggers.configure.text="Automatize fluxos menores com ações que respondem ao comportamento e a eventos, como envios de formulários, aberturas de e-mails ou visitas a páginas."
mautic.producttour.point_groups.organize.title="Organize suas estratégias de pontos"
mautic.producttour.point_groups.organize.text="Os grupos ajudam a organizar pontos e gerenciar estratégias para vários públicos, permitindo diferenciar as métricas de engajamento."
mautic.producttour.stages.map_journey.title="Mapeie a jornada do cliente"
mautic.producttour.stages.map_journey.text="Aqui você define e gerencia as etapas do ciclo de vida do cliente. Ao organizar leads por etapa, pode aplicar estratégias direcionadas e personalizar as comunicações."
mautic.producttour.reports.gain_insights.title="Obtenha insights dos seus dados"
mautic.producttour.reports.gain_insights.text="Esta seção permite criar, personalizar e analisar relatórios. Acompanhe a eficácia das campanhas, o engajamento por e-mail, a geração de leads e muito mais."
mautic.producttour.tags.organize_contacts.title="Organize contatos com tags"
mautic.producttour.tags.organize_contacts.text="Tags são rótulos personalizáveis que você aplica aos contatos no Mautic. Elas facilitam a segmentação e o marketing direcionado, além de filtrar e pesquisar grupos específicos."
