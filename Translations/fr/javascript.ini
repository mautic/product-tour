mautic.producttour.button.next="Suivant"
mautic.producttour.button.back="Précédent"
mautic.producttour.button.finish="Terminer"
mautic.producttour.button.go_to_configuration="Aller à la configuration"
mautic.producttour.button.go_to_tracking_settings="Aller aux paramètres de suivi"
mautic.producttour.button.go_to_contacts="Aller aux contacts"
mautic.producttour.dashboard.welcome.title="Bienvenue dans Mautic"
mautic.producttour.dashboard.welcome.text="Voici votre tableau de bord. Suivez la visite pour démarrer et découvrir le fonctionnement des fonctionnalités."
mautic.producttour.dashboard.filter.title="Filtrer les données du tableau de bord"
mautic.producttour.dashboard.filter.text="Par défaut, Mautic affiche les données des 30 derniers jours, mais vous pouvez modifier ce réglage dans la configuration. Il s'applique à tous les widgets."
mautic.producttour.dashboard.widgets.title="Voir les informations essentielles avec les widgets"
mautic.producttour.dashboard.widgets.text="Ces graphiques servent à afficher vos données. Dès que des informations sont collectées, consultez-les à nouveau."
mautic.producttour.dashboard.navigation.title="Naviguer dans Mautic"
mautic.producttour.dashboard.navigation.text="Le menu principal vous permet d'accéder facilement aux différentes fonctionnalités et de les explorer."
mautic.producttour.dashboard.tracking.title="Connecter le script de suivi"
mautic.producttour.dashboard.tracking.text="Pour commencer à collecter les données des visiteurs, ouvrez la configuration et installez votre script de suivi."
mautic.producttour.configuration.visitor_tracking.title="Configurer le suivi des visiteurs"
mautic.producttour.configuration.visitor_tracking.text="Cette page permet de gérer le fonctionnement de Mautic. Commençons par vérifier que les visiteurs peuvent être suivis."
mautic.producttour.configuration.implement_tracking.title="Installer le suivi sur votre site"
mautic.producttour.configuration.implement_tracking.text="Copiez ce code et collez-le à la fin de la balise body de votre site."
mautic.producttour.configuration.grow_list.title="Développer votre liste"
mautic.producttour.configuration.grow_list.text="Dès que des personnes visitent votre site, vous trouverez les nouveaux visiteurs dans votre page Contacts."
mautic.producttour.contacts.explore_database.title="Explorer votre base de contacts"
mautic.producttour.contacts.explore_database.text="Après avoir installé le code de suivi Mautic, vous pourrez voir les visiteurs identifiés et non identifiés qui interagissent avec votre site. Importez vos propres contacts pour remplir ou étendre cette liste."
mautic.producttour.contacts.toggle_anonymous.title="Afficher ou masquer les contacts anonymes"
mautic.producttour.contacts.toggle_anonymous.text="Mautic crée des visiteurs non identifiés à partir de leur adresse IP, sans nom ni adresse e-mail. Cliquez plus tard pour basculer entre les visiteurs non identifiés (contacts anonymes) et connus (contacts)."
mautic.producttour.contacts.import.title="Importer vos contacts"
mautic.producttour.contacts.import.text="Cliquez sur la flèche pour ouvrir le menu, puis choisissez \"Importer\" pour ajouter rapidement des leads ou \"Historique des imports\" pour consulter les imports précédents."
mautic.producttour.segments.understand.title="Comprendre la segmentation des contacts"
mautic.producttour.segments.understand.text="Les segments servent à classer vos contacts dans des listes selon leurs attributs, leur comportement ou leur participation aux campagnes."
mautic.producttour.segments.initiate_creation.title="Commencer à créer un segment"
mautic.producttour.segments.initiate_creation.text="Cliquez sur \"Nouveau\" pour ajouter un segment. Vous pouvez par exemple suivre les contacts qui ont visité la page de contact de votre site."
mautic.producttour.segments.internal_name.title="Définir le nom interne"
mautic.producttour.segments.internal_name.text="Il sera visible uniquement par vous et les autres utilisateurs de Mautic sur la page des segments."
mautic.producttour.segments.customer_facing_name.title="Définir le nom public du segment"
mautic.producttour.segments.customer_facing_name.text="Utilisez ce champ pour afficher un autre nom aux contacts. Il peut être utile dans le centre de préférences pour gérer plus tard leur appartenance au segment."
mautic.producttour.segments.activate.title="Activer le segment"
mautic.producttour.segments.activate.text="Définissez le segment comme actif pour pouvoir l'utiliser ensuite."
mautic.producttour.segments.begin_setup.title="Commencer la configuration du segment"
mautic.producttour.segments.begin_setup.text="Ajoutez des filtres pour créer des segments dynamiques qui ajoutent et retirent automatiquement des contacts. Ignorez cette étape pour garder un segment statique."
mautic.producttour.segments.select_criteria.title="Sélectionner les critères du segment"
mautic.producttour.segments.select_criteria.text="Vous pouvez filtrer selon des informations connues et le comportement. Par exemple, utilisez \"URL visitée\" pour ajouter les contacts ayant consulté une page précise."
mautic.producttour.segments.combine_filters.title="Combiner les filtres du segment"
mautic.producttour.segments.combine_filters.text="Pour plusieurs filtres, sélectionnez des champs supplémentaires et indiquez si les filtres utilisent les expressions \"ET\" ou \"OU\"."
mautic.producttour.segments.good_to_go.title="Tout est prêt"
mautic.producttour.segments.good_to_go.text="Vous avez créé un segment. Enregistrez-le pour terminer."
mautic.producttour.campaigns.welcome.title="Bienvenue dans votre centre de campagnes"
mautic.producttour.campaigns.welcome.text="C'est ici que vous gérez et pilotez vos processus d'automatisation marketing dans Mautic."
mautic.producttour.emails.craft.title="Créer des e-mails remarquables"
mautic.producttour.emails.craft.text="Ici, vous pouvez créer, personnaliser et suivre facilement vos communications par e-mail."
mautic.producttour.messages.hub.title="Votre centre de messagerie multicanal"
mautic.producttour.messages.hub.text="Cet espace permet de créer et gérer des messages marketing personnalisés sur plusieurs canaux. Organisez l'envoi de SMS, d'e-mails, de messages sociaux et de notifications push."
mautic.producttour.focus.capture_attention.title="Attirer l'attention avec les éléments Focus"
mautic.producttour.focus.capture_attention.text="Les éléments Focus permettent de créer des fenêtres contextuelles, modales et bannières pour attirer l'attention et encourager des actions comme l'inscription à une newsletter ou le remplissage d'un formulaire."
mautic.producttour.assets.manage.title="Gérer vos ressources numériques"
mautic.producttour.assets.manage.text="Voici votre espace central pour gérer toutes les ressources numériques utilisées dans vos campagnes marketing."
mautic.producttour.forms.design.title="Concevoir vos outils de collecte de données"
mautic.producttour.forms.design.text="Ici, vous pouvez créer et gérer des formulaires pour recueillir efficacement des données clients utiles."
mautic.producttour.landing_pages.create.title="Créer des pages d'atterrissage efficaces"
mautic.producttour.landing_pages.create.text="Concevez, personnalisez et optimisez facilement vos pages d'atterrissage. Le générateur intuitif par glisser-déposer de Mautic vous permet d'ajouter des images, des formulaires et des CTA pour gagner des leads et augmenter les conversions."
mautic.producttour.dynamic_content.personalize.title="Personnaliser dynamiquement votre contenu"
mautic.producttour.dynamic_content.personalize.text="Créez des expériences personnalisées grâce à un contenu adapté au comportement et aux préférences de votre audience. Personnalisez dynamiquement le contenu des sites, les e-mails et les pages d'atterrissage."
mautic.producttour.point_actions.automated_responses.title="Configurer des réponses automatisées"
mautic.producttour.point_actions.automated_responses.text="Définissez et automatisez les réponses aux interactions dans vos campagnes marketing, comme les e-mails de suivi, les scores de leads ou l'ajout de contacts à des segments."
mautic.producttour.point_triggers.configure.title="Configurer vos déclencheurs marketing"
mautic.producttour.point_triggers.configure.text="Automatisez de petits workflows avec des actions qui réagissent au comportement et aux événements, comme les soumissions de formulaires, les ouvertures d'e-mails ou les visites de pages."
mautic.producttour.point_groups.organize.title="Organiser vos stratégies de points"
mautic.producttour.point_groups.organize.text="Les groupes vous aident à organiser les points et à gérer des stratégies visant plusieurs audiences. Vous pouvez ainsi distinguer les indicateurs d'engagement."
mautic.producttour.stages.map_journey.title="Cartographier le parcours client"
mautic.producttour.stages.map_journey.text="Définissez et gérez ici les étapes du cycle de vie client. En organisant les leads par étape, vous pouvez appliquer des stratégies ciblées et personnaliser vos communications."
mautic.producttour.reports.gain_insights.title="Tirer des enseignements de vos données"
mautic.producttour.reports.gain_insights.text="Cette section permet de créer, personnaliser et analyser de nombreux rapports. Suivez l'efficacité des campagnes, l'engagement par e-mail, la génération de leads et bien plus encore."
mautic.producttour.tags.organize_contacts.title="Organiser les contacts avec des tags"
mautic.producttour.tags.organize_contacts.text="Les tags sont des libellés personnalisables à appliquer aux contacts dans Mautic. Ils facilitent la segmentation et le marketing ciblé. Créez, modifiez et gérez vos tags pour filtrer et rechercher des groupes précis."
