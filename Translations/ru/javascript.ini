mautic.producttour.button.next="Далее"
mautic.producttour.button.back="Назад"
mautic.producttour.button.finish="Завершить"
mautic.producttour.button.go_to_configuration="Перейти к настройкам"
mautic.producttour.button.go_to_tracking_settings="Перейти к настройкам отслеживания"
mautic.producttour.button.go_to_contacts="Перейти к контактам"
mautic.producttour.dashboard.welcome.title="Добро пожаловать в Mautic"
mautic.producttour.dashboard.welcome.text="Это ваша панель управления. Пройдите тур, чтобы начать работу и узнать, как работают функции."
mautic.producttour.dashboard.filter.title="Фильтрация данных панели"
mautic.producttour.dashboard.filter.text="По умолчанию Mautic показывает данные за последние 30 дней, но это можно изменить в настройках. Изменение применяется ко всем виджетам."
mautic.producttour.dashboard.widgets.title="Просматривайте важную информацию с помощью виджетов"
mautic.producttour.dashboard.widgets.text="Эти диаграммы отображают данные. Когда начнёт собираться информация, проверьте их ещё раз."
mautic.producttour.dashboard.navigation.title="Навигация по Mautic"
mautic.producttour.dashboard.navigation.text="Главное меню позволяет легко открывать и изучать различные функции."
mautic.producttour.dashboard.tracking.title="Подключите скрипт отслеживания"
mautic.producttour.dashboard.tracking.text="Чтобы начать собирать данные о посетителях, откройте настройки и добавьте скрипт отслеживания."
mautic.producttour.configuration.visitor_tracking.title="Настройте отслеживание посетителей"
mautic.producttour.configuration.visitor_tracking.text="На этой странице вы управляете работой Mautic. Сначала убедимся, что посетителей можно отслеживать."
mautic.producttour.configuration.implement_tracking.title="Добавьте отслеживание на сайт"
mautic.producttour.configuration.implement_tracking.text="Скопируйте этот код и вставьте его в конце тега body на вашем сайте."
mautic.producttour.configuration.grow_list.title="Расширяйте список"
mautic.producttour.configuration.grow_list.text="Когда люди начнут посещать ваш сайт, новые посетители появятся на странице контактов."
mautic.producttour.contacts.explore_database.title="Изучите базу контактов"
mautic.producttour.contacts.explore_database.text="После установки кода отслеживания Mautic вы сможете видеть неизвестных и известных посетителей, взаимодействующих с сайтом. Импортируйте собственные контакты, чтобы заполнить или расширить этот список."
mautic.producttour.contacts.toggle_anonymous.title="Переключайте анонимные контакты"
mautic.producttour.contacts.toggle_anonymous.text="Mautic создаёт неизвестных посетителей на основе IP-адреса, если имя или адрес электронной почты ещё не известны. Позже нажмите, чтобы переключаться между неизвестными (анонимными) и известными контактами."
mautic.producttour.contacts.import.title="Импортируйте контакты"
mautic.producttour.contacts.import.text="Нажмите кнопку со стрелкой, откройте меню и выберите \"Импорт\", чтобы быстро добавить лидов, или \"История импорта\", чтобы просмотреть предыдущие импорты."
mautic.producttour.segments.understand.title="Разберитесь в сегментации контактов"
mautic.producttour.segments.understand.text="Сегменты используются для распределения контактов по спискам на основе их свойств, поведения или участия в кампаниях."
mautic.producttour.segments.initiate_creation.title="Начните создание сегмента"
mautic.producttour.segments.initiate_creation.text="Нажмите \"Новый\", чтобы добавить сегмент. Например, можно отслеживать контакты, посетившие страницу контактов вашего сайта."
mautic.producttour.segments.internal_name.title="Задайте внутреннее имя"
mautic.producttour.segments.internal_name.text="Оно будет видно только вам и другим пользователям Mautic на странице сегментов."
mautic.producttour.segments.customer_facing_name.title="Задайте имя сегмента для контактов"
mautic.producttour.segments.customer_facing_name.text="Используйте это поле, чтобы показывать контактам другое имя. Позже оно пригодится в центре предпочтений для управления членством в сегменте."
mautic.producttour.segments.activate.title="Активируйте сегмент"
mautic.producttour.segments.activate.text="Установите для сегмента статус «Активен», чтобы использовать его позже."
mautic.producttour.segments.begin_setup.title="Начните настройку сегмента"
mautic.producttour.segments.begin_setup.text="С помощью фильтров можно создавать динамические сегменты, которые автоматически добавляют и удаляют контакты. Пропустите этот шаг, чтобы оставить сегмент статическим."
mautic.producttour.segments.select_criteria.title="Выберите критерии сегмента"
mautic.producttour.segments.select_criteria.text="Фильтруйте по известной информации и поведению. Например, используйте \"Посетил URL\", чтобы добавить контакты, открывшие определённую страницу."
mautic.producttour.segments.combine_filters.title="Объедините фильтры сегмента"
mautic.producttour.segments.combine_filters.text="Для нескольких фильтров выберите дополнительные поля и укажите, использовать ли выражения \"И\" или \"ИЛИ\"."
mautic.producttour.segments.good_to_go.title="Всё готово"
mautic.producttour.segments.good_to_go.text="Вы создали сегмент. Сохраните его, чтобы завершить."
mautic.producttour.campaigns.welcome.title="Добро пожаловать в центр кампаний"
mautic.producttour.campaigns.welcome.text="Здесь вы управляете процессами маркетинговой автоматизации в Mautic."
mautic.producttour.emails.craft.title="Создавайте отличные письма"
mautic.producttour.emails.craft.text="Здесь можно легко создавать, настраивать и отслеживать электронные письма."
mautic.producttour.messages.hub.title="Ваш центр многоканальных сообщений"
mautic.producttour.messages.hub.text="Здесь вы создаёте и управляете персонализированными маркетинговыми сообщениями в разных каналах. Организуйте отправку SMS, писем, сообщений в социальных сетях и push-уведомлений."
mautic.producttour.focus.capture_attention.title="Привлекайте внимание фокус-элементами"
mautic.producttour.focus.capture_attention.text="Фокус-элементы позволяют создавать всплывающие окна, модальные окна и баннеры, которые привлекают внимание и побуждают подписаться на рассылку или заполнить форму."
mautic.producttour.assets.manage.title="Управляйте цифровыми ресурсами"
mautic.producttour.assets.manage.text="Это центральное место для управления всеми цифровыми ресурсами ваших маркетинговых кампаний."
mautic.producttour.forms.design.title="Создавайте инструменты сбора данных"
mautic.producttour.forms.design.text="Здесь можно создавать и управлять формами для эффективного сбора ценных данных клиентов."
mautic.producttour.landing_pages.create.title="Создавайте привлекательные целевые страницы"
mautic.producttour.landing_pages.create.text="Здесь вы легко создаёте, настраиваете и оптимизируете целевые страницы. Интуитивный редактор Mautic с перетаскиванием позволяет добавлять изображения, формы и CTA для привлечения лидов и роста конверсий."
mautic.producttour.dynamic_content.personalize.title="Динамически персонализируйте контент"
mautic.producttour.dynamic_content.personalize.text="Создавайте персонализированный опыт с помощью контента, адаптированного к поведению и предпочтениям аудитории. Динамически настраивайте содержимое сайта, письма и целевые страницы."
mautic.producttour.point_actions.automated_responses.title="Настройте автоматические ответы"
mautic.producttour.point_actions.automated_responses.text="Определяйте и автоматизируйте ответы на взаимодействия пользователей в маркетинговых кампаниях: последующие письма, изменение оценки лида или добавление контактов в сегменты."
mautic.producttour.point_triggers.configure.title="Настройте маркетинговые триггеры"
mautic.producttour.point_triggers.configure.text="Автоматизируйте небольшие процессы с помощью действий, реагирующих на поведение и события: отправку форм, открытия писем или посещения страниц."
mautic.producttour.point_groups.organize.title="Организуйте стратегии баллов"
mautic.producttour.point_groups.organize.text="Группы помогают организовывать баллы и управлять стратегиями для нескольких аудиторий, чтобы различать показатели вовлечённости."
mautic.producttour.stages.map_journey.title="Постройте путь клиента"
mautic.producttour.stages.map_journey.text="Здесь вы определяете этапы жизненного цикла клиента. Распределяя лидов по этапам, можно применять целевые стратегии и персонализировать коммуникации."
mautic.producttour.reports.gain_insights.title="Получайте сведения из данных"
mautic.producttour.reports.gain_insights.text="В этом разделе можно создавать, настраивать и анализировать отчёты. Отслеживайте эффективность кампаний, вовлечённость в письма, привлечение лидов и другие показатели."
mautic.producttour.tags.organize_contacts.title="Организуйте контакты с помощью тегов"
mautic.producttour.tags.organize_contacts.text="Теги — это настраиваемые метки для контактов в Mautic. Они упрощают сегментацию и целевой маркетинг, а также фильтрацию и поиск групп контактов."
