mautic.producttour.dashboard.welcome.title="Welcome to Mautic"
mautic.producttour.dashboard.welcome.text="This is your dashboard. Follow the tour to get started and learn how features work."
mautic.producttour.dashboard.filter.title="Filter the dashboard data"
mautic.producttour.dashboard.filter.text="By default, Mautic displays data from the past 30 days, but you can change it in the configuration. It applies to all widgets."
mautic.producttour.dashboard.widgets.title="See essential information using widgets"
mautic.producttour.dashboard.widgets.text="These are the charts used to display data. As soon as information starts being collected, check them again."
mautic.producttour.dashboard.navigation.title="Navigate through Mautic"
mautic.producttour.dashboard.navigation.text="The main menu allows you to easily access and explore its various features."
mautic.producttour.dashboard.tracking.title="Connect tracking script"
mautic.producttour.dashboard.tracking.text="To start collecting visitor data, go to the configuration and set up your tracking script."
mautic.producttour.configuration.visitor_tracking.title="Configure visitor tracking"
mautic.producttour.configuration.visitor_tracking.text="On this page, you can manage the way your Mautic works, but first let's make sure we can track visitors."
mautic.producttour.configuration.implement_tracking.title="Implement tracking on your website"
mautic.producttour.configuration.implement_tracking.text="Copy this code and paste it at the end of the body tag in your website."
mautic.producttour.configuration.grow_list.title="Grow your list"
mautic.producttour.configuration.grow_list.text="Once people start accessing your website, you'll find new visitors in your Contacts page."
mautic.producttour.contacts.explore_database.title="Explore your contact database"
mautic.producttour.contacts.explore_database.text="Once you've implemented Mautic's tracking code, you will be able to see all the unidentified and identified visitors that are interacting with your website. To fill or extend this list, import your own contacts."
mautic.producttour.contacts.toggle_anonymous.title="Toggle anonymous contacts"
mautic.producttour.contacts.toggle_anonymous.text="Mautic creates unidentified visitors, contacts that we don't have a name or email address for yet, based on their IP. Click to toggle between unidentified visitors (anonymous contacts) and known visitors (contacts) later."
mautic.producttour.contacts.import.title="Import your contacts"
mautic.producttour.contacts.import.text="Click on the arrow-button to open the menu and find \"Import\" to quickly bring leads or \"Import history\" to see previously imported contacts."
mautic.producttour.segments.understand.title="Understand contact segmentation"
mautic.producttour.segments.understand.text="Segments are used to categorize your contacts into specific lists based on their attributes, behavior, or campaign participation."
mautic.producttour.segments.initiate_creation.title="Initiate segment creation"
mautic.producttour.segments.initiate_creation.text="Click \"New\" to add a new segment. For example, you can create the first to monitor contacts who visited your website's contact page."
mautic.producttour.segments.internal_name.title="Define internal name"
mautic.producttour.segments.internal_name.text="It will be visible only for you and other Mautic users in the segments page."
mautic.producttour.segments.customer_facing_name.title="Set customer-facing segment name"
mautic.producttour.segments.customer_facing_name.text="Use this field to display another name to contacts. It'd be useful in the preference center to allow people to manage their segment membership later."
mautic.producttour.segments.activate.title="Activate segment"
mautic.producttour.segments.activate.text="Make sure to put the segment as Active to use it later."
mautic.producttour.segments.begin_setup.title="Begin segment setup"
mautic.producttour.segments.begin_setup.text="By adding filters, you can create dynamic segments, which add and remove contacts automatically. Otherwise, just skip this step to keep them static."
mautic.producttour.segments.select_criteria.title="Select segment criteria"
mautic.producttour.segments.select_criteria.text="You can filter based on known information and behavior. For example, use \"Visited X URL\" to add contacts that accessed a specific page."
mautic.producttour.segments.combine_filters.title="Combine segment filters"
mautic.producttour.segments.combine_filters.text="For multiple filters, select additional fields from the dropdown and specify whether the filters should use \"AND\" or \"OR\" expressions."
mautic.producttour.segments.good_to_go.title="Good to go"
mautic.producttour.segments.good_to_go.text="You created a segment. Save it to finish."
mautic.producttour.campaigns.welcome.title="Welcome to your campaign headquarters"
mautic.producttour.campaigns.welcome.text="Here, you'll manage and power your marketing automation processes within Mautic."
mautic.producttour.emails.craft.title="Craft your email masterpieces"
mautic.producttour.emails.craft.text="Here, you can effortlessly create, customize, and track your email communications."
mautic.producttour.messages.hub.title="Your multi-channel messaging hub"
mautic.producttour.messages.hub.text="This is your go-to destination for crafting and managing personalized marketing messages across various channels at once. It allows you organize the sending for SMS, email, social media, and push notifications."
mautic.producttour.focus.capture_attention.title="Capture attention with focus items"
mautic.producttour.focus.capture_attention.text="Focus items allow you to create pop-ups, modals, and banners designed to capture your visitors' attention and encourage specific actions, such as subscribing to a newsletter or completing a form."
mautic.producttour.assets.manage.title="Manage your digital treasures"
mautic.producttour.assets.manage.text="This is your central hub for managing all digital assets used in your marketing campaigns."
mautic.producttour.forms.design.title="Design your data collection tools"
mautic.producttour.forms.design.text="Here, you can create and manage forms to capture valuable customer data effectively."
mautic.producttour.landing_pages.create.title="Create compelling landing pages"
mautic.producttour.landing_pages.create.text="This is where you can design, customize, and optimize your landing pages with ease. Using Mautic's intuitive drag-and-drop builder, you can effortlessly add images, forms, and CTAs to capture leads and boost conversions."
mautic.producttour.dynamic_content.personalize.title="Personalize your content dynamically"
mautic.producttour.dynamic_content.personalize.text="Here, you can craft personalized experiences for your audience by delivering tailored content based on user behavior and preferences. Customize website content, emails, and landing pages dynamically to ensure each visitor receives relevant and engaging messages."
mautic.producttour.point_actions.automated_responses.title="Set up automated responses"
mautic.producttour.point_actions.automated_responses.text="Here, you can define and automate responses to user interactions within your marketing campaigns. Set up actions like sending follow-up emails, adjusting lead scores, or adding contacts to segments based on predefined conditions and triggers."
mautic.producttour.point_triggers.configure.title="Configure your marketing triggers"
mautic.producttour.point_triggers.configure.text="Automate smaller workflows by configuring actions that respond to user behavior and events. These triggers activate based on interactions such as form submissions, email opens, or page visits, streamlining your marketing processes."
mautic.producttour.point_groups.organize.title="Organize your point strategies"
mautic.producttour.point_groups.organize.text="Groups allow you to organize separate amount of points. They're useful to have control over strategies targeting several audiences and help you to differentiate engagement metrics for each."
mautic.producttour.stages.map_journey.title="Map out your customer journey"
mautic.producttour.stages.map_journey.text="Here, you can define and manage the various stages of the customer lifecycle, from initial contact to post-purchase engagement. By organizing leads into distinct stages, you can implement targeted marketing strategies, personalize communications, and analyze progression through the marketing funnel."
mautic.producttour.reports.gain_insights.title="Gain insights from your data"
mautic.producttour.reports.gain_insights.text="This section enables you to create, customize, and analyze a wide range of reports. Track key metrics such as campaign effectiveness, email engagement, lead generation, and more to gain valuable insights into your marketing performance."
mautic.producttour.tags.organize_contacts.title="Organize contacts with tags"
mautic.producttour.tags.organize_contacts.text="Tags are customizable labels you can apply to contacts within Mautic. They help streamline segmentation and targeted marketing. Here, you can create, edit, and manage tags, making it easier to filter and search for specific groups of contacts."
