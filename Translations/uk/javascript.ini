mautic.producttour.button.next="Далі"
mautic.producttour.button.back="Назад"
mautic.producttour.button.finish="Завершити"
mautic.producttour.button.go_to_configuration="Перейти до налаштувань"
mautic.producttour.button.go_to_tracking_settings="Перейти до налаштувань відстеження"
mautic.producttour.button.go_to_contacts="Перейти до контактів"
mautic.producttour.dashboard.welcome.title="Вітаємо в Mautic"
mautic.producttour.dashboard.welcome.text="Це ваша інформаційна панель. Пройдіть тур, щоб почати роботу та дізнатися, як працюють функції."
mautic.producttour.dashboard.filter.title="Фільтрування даних панелі"
mautic.producttour.dashboard.filter.text="За замовчуванням Mautic показує дані за останні 30 днів, але це можна змінити в налаштуваннях. Зміна застосовується до всіх віджетів."
mautic.producttour.dashboard.widgets.title="Переглядайте важливу інформацію за допомогою віджетів"
mautic.producttour.dashboard.widgets.text="Ці діаграми відображають дані. Коли почнуть збиратися нові відомості, перевірте їх знову."
mautic.producttour.dashboard.navigation.title="Навігація в Mautic"
mautic.producttour.dashboard.navigation.text="Головне меню дає змогу легко відкривати й досліджувати різні функції."
mautic.producttour.dashboard.tracking.title="Підключіть скрипт відстеження"
mautic.producttour.dashboard.tracking.text="Щоб почати збирати дані відвідувачів, відкрийте налаштування та додайте скрипт відстеження."
mautic.producttour.configuration.visitor_tracking.title="Налаштуйте відстеження відвідувачів"
mautic.producttour.configuration.visitor_tracking.text="На цій сторінці можна керувати роботою Mautic. Спочатку переконаймося, що відвідувачів можна відстежувати."
mautic.producttour.configuration.implement_tracking.title="Додайте відстеження на сайт"
mautic.producttour.configuration.implement_tracking.text="Скопіюйте цей код і вставте його наприкінці тегу body на сайті."
mautic.producttour.configuration.grow_list.title="Розширюйте список"
mautic.producttour.configuration.grow_list.text="Коли люди почнуть відвідувати сайт, нові відвідувачі з'являтимуться на сторінці контактів."
mautic.producttour.contacts.explore_database.title="Дослідіть базу контактів"
mautic.producttour.contacts.explore_database.text="Після встановлення коду відстеження Mautic ви зможете бачити невідомих та ідентифікованих відвідувачів, які взаємодіють із сайтом. Імпортуйте власні контакти, щоб наповнити або розширити список."
mautic.producttour.contacts.toggle_anonymous.title="Перемикайте анонімні контакти"
mautic.producttour.contacts.toggle_anonymous.text="Mautic створює неідентифікованих відвідувачів на основі IP-адреси, якщо ще немає імені чи електронної адреси. Пізніше натисніть, щоб перемикатися між анонімними та відомими контактами."
mautic.producttour.contacts.import.title="Імпортуйте контакти"
mautic.producttour.contacts.import.text="Натисніть кнопку зі стрілкою, відкрийте меню та виберіть \"Імпорт\", щоб швидко додати лідів, або \"Історія імпорту\", щоб переглянути попередні імпорти."
mautic.producttour.segments.understand.title="Зрозумійте сегментацію контактів"
mautic.producttour.segments.understand.text="Сегменти використовуються для розподілу контактів у списки за їхніми властивостями, поведінкою або участю в кампаніях."
mautic.producttour.segments.initiate_creation.title="Почніть створення сегмента"
mautic.producttour.segments.initiate_creation.text="Натисніть \"Новий\", щоб додати сегмент. Наприклад, можна відстежувати контакти, які відвідали сторінку контактів вашого сайту."
mautic.producttour.segments.internal_name.title="Визначте внутрішню назву"
mautic.producttour.segments.internal_name.text="Її бачитимете лише ви та інші користувачі Mautic на сторінці сегментів."
mautic.producttour.segments.customer_facing_name.title="Задайте назву сегмента для контактів"
mautic.producttour.segments.customer_facing_name.text="Використовуйте це поле, щоб показувати контактам іншу назву. Пізніше вона може допомогти керувати членством у сегменті в центрі налаштувань."
mautic.producttour.segments.activate.title="Активуйте сегмент"
mautic.producttour.segments.activate.text="Встановіть для сегмента статус Активний, щоб використовувати його надалі."
mautic.producttour.segments.begin_setup.title="Почніть налаштування сегмента"
mautic.producttour.segments.begin_setup.text="Додаючи фільтри, можна створювати динамічні сегменти, які автоматично додають і видаляють контакти. Пропустіть цей крок, щоб залишити сегмент статичним."
mautic.producttour.segments.select_criteria.title="Виберіть критерії сегмента"
mautic.producttour.segments.select_criteria.text="Фільтруйте за відомою інформацією та поведінкою. Наприклад, використайте \"Відвідана URL-адреса\", щоб додати контакти, які відкрили певну сторінку."
mautic.producttour.segments.combine_filters.title="Поєднайте фільтри сегмента"
mautic.producttour.segments.combine_filters.text="Для кількох фільтрів виберіть додаткові поля та вкажіть, чи використовувати вирази \"І\" або \"АБО\"."
mautic.producttour.segments.good_to_go.title="Усе готово"
mautic.producttour.segments.good_to_go.text="Ви створили сегмент. Збережіть його, щоб завершити."
mautic.producttour.campaigns.welcome.title="Вітаємо у вашому центрі кампаній"
mautic.producttour.campaigns.welcome.text="Тут ви керуєте процесами маркетингової автоматизації в Mautic."
mautic.producttour.emails.craft.title="Створюйте чудові листи"
mautic.producttour.emails.craft.text="Тут можна легко створювати, налаштовувати й відстежувати електронні листи."
mautic.producttour.messages.hub.title="Ваш центр багатоканальних повідомлень"
mautic.producttour.messages.hub.text="Тут ви створюєте й керуєте персоналізованими маркетинговими повідомленнями в різних каналах. Організовуйте надсилання SMS, листів, повідомлень у соцмережах і push-сповіщень."
mautic.producttour.focus.capture_attention.title="Привертайте увагу фокус-елементами"
mautic.producttour.focus.capture_attention.text="Фокус-елементи дають змогу створювати спливаючі вікна, модальні вікна й банери, що привертають увагу та спонукають підписатися на розсилку або заповнити форму."
mautic.producttour.assets.manage.title="Керуйте цифровими ресурсами"
mautic.producttour.assets.manage.text="Це центральне місце для керування всіма цифровими ресурсами у ваших маркетингових кампаніях."
mautic.producttour.forms.design.title="Створюйте інструменти збору даних"
mautic.producttour.forms.design.text="Тут можна створювати й керувати формами для ефективного збору цінних даних клієнтів."
mautic.producttour.landing_pages.create.title="Створюйте привабливі цільові сторінки"
mautic.producttour.landing_pages.create.text="Тут легко розробляти, налаштовувати й оптимізувати цільові сторінки. Інтуїтивний редактор Mautic із перетягуванням дає змогу додавати зображення, форми та CTA для залучення лідів і збільшення конверсій."
mautic.producttour.dynamic_content.personalize.title="Динамічно персоналізуйте вміст"
mautic.producttour.dynamic_content.personalize.text="Створюйте персоналізований досвід, показуючи вміст відповідно до поведінки та вподобань аудиторії. Динамічно налаштовуйте вміст сайту, листи й цільові сторінки."
mautic.producttour.point_actions.automated_responses.title="Налаштуйте автоматичні відповіді"
mautic.producttour.point_actions.automated_responses.text="Визначайте й автоматизуйте відповіді на взаємодії користувачів у маркетингових кампаніях: подальші листи, оцінювання лідів або додавання контактів до сегментів."
mautic.producttour.point_triggers.configure.title="Налаштуйте маркетингові тригери"
mautic.producttour.point_triggers.configure.text="Автоматизуйте невеликі процеси діями, що реагують на поведінку та події, як-от надсилання форм, відкриття листів або відвідування сторінок."
mautic.producttour.point_groups.organize.title="Організуйте стратегії балів"
mautic.producttour.point_groups.organize.text="Групи допомагають організовувати бали й керувати стратегіями для кількох аудиторій, щоб розрізняти показники залучення."
mautic.producttour.stages.map_journey.title="Побудуйте шлях клієнта"
mautic.producttour.stages.map_journey.text="Тут ви визначаєте етапи життєвого циклу клієнта. Організовуючи ліди за етапами, можна застосовувати цільові стратегії та персоналізувати комунікації."
mautic.producttour.reports.gain_insights.title="Отримуйте висновки з даних"
mautic.producttour.reports.gain_insights.text="У цьому розділі можна створювати, налаштовувати й аналізувати звіти. Відстежуйте ефективність кампаній, взаємодію з листами, залучення лідів та інші показники."
mautic.producttour.tags.organize_contacts.title="Організуйте контакти за тегами"
mautic.producttour.tags.organize_contacts.text="Теги — це налаштовані мітки для контактів у Mautic. Вони спрощують сегментацію та цільовий маркетинг, а також фільтрування й пошук груп контактів."
