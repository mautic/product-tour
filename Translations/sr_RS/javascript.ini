mautic.producttour.button.next="Sledeće"
mautic.producttour.button.back="Nazad"
mautic.producttour.button.finish="Završi"
mautic.producttour.button.go_to_configuration="Idi na podešavanja"
mautic.producttour.button.go_to_tracking_settings="Idi na podešavanja praćenja"
mautic.producttour.button.go_to_contacts="Idi na kontakte"
mautic.producttour.dashboard.welcome.title="Dobro došli u Mautic"
mautic.producttour.dashboard.welcome.text="Ovo je vaša kontrolna tabla. Pratite turu da biste počeli i saznali kako funkcije rade."
mautic.producttour.dashboard.filter.title="Filtrirajte podatke kontrolne table"
mautic.producttour.dashboard.filter.text="Mautic podrazumevano prikazuje podatke iz poslednjih 30 dana, ali to možete promeniti u podešavanjima. Promena važi za sve vidžete."
mautic.producttour.dashboard.widgets.title="Pogledajte važne informacije pomoću vidžeta"
mautic.producttour.dashboard.widgets.text="Ovi grafikoni prikazuju podatke. Kada počne prikupljanje informacija, proverite ih ponovo."
mautic.producttour.dashboard.navigation.title="Kretanje kroz Mautic"
mautic.producttour.dashboard.navigation.text="Glavni meni vam omogućava da lako pristupite različitim funkcijama i istražite ih."
mautic.producttour.dashboard.tracking.title="Povežite skriptu za praćenje"
mautic.producttour.dashboard.tracking.text="Da biste počeli da prikupljate podatke o posetiocima, otvorite podešavanja i postavite skriptu za praćenje."
mautic.producttour.configuration.visitor_tracking.title="Podesite praćenje posetilaca"
mautic.producttour.configuration.visitor_tracking.text="Na ovoj stranici upravljate načinom rada Mautic-a. Najpre proverimo da li možemo da pratimo posetioce."
mautic.producttour.configuration.implement_tracking.title="Postavite praćenje na svom sajtu"
mautic.producttour.configuration.implement_tracking.text="Kopirajte ovaj kôd i nalepite ga na kraj body oznake svog sajta."
mautic.producttour.configuration.grow_list.title="Proširite svoju listu"
mautic.producttour.configuration.grow_list.text="Kada ljudi počnu da posećuju vaš sajt, nove posetioce ćete pronaći na stranici Kontakti."
mautic.producttour.contacts.explore_database.title="Istražite bazu kontakata"
mautic.producttour.contacts.explore_database.text="Kada postavite Mautic kôd za praćenje, moći ćete da vidite identifikovane i neidentifikovane posetioce koji stupaju u interakciju sa vašim sajtom. Uvezite svoje kontakte da biste popunili ili proširili ovu listu."
mautic.producttour.contacts.toggle_anonymous.title="Uključite ili isključite anonimne kontakte"
mautic.producttour.contacts.toggle_anonymous.text="Mautic na osnovu IP adrese pravi neidentifikovane posetioce za koje još nemamo ime ili adresu e-pošte. Kasnije kliknite da biste prešli između neidentifikovanih posetilaca (anonimnih kontakata) i poznatih posetilaca (kontakata)."
mautic.producttour.contacts.import.title="Uvezite kontakte"
mautic.producttour.contacts.import.text="Kliknite na dugme sa strelicom da otvorite meni, pa pronađite \"Uvezi\" za brz uvoz potencijalnih klijenata ili \"Istorija uvoza\" za prethodne uvoze."
mautic.producttour.segments.understand.title="Razumite segmentaciju kontakata"
mautic.producttour.segments.understand.text="Segmenti služe za razvrstavanje kontakata u liste na osnovu njihovih osobina, ponašanja ili učešća u kampanjama."
mautic.producttour.segments.initiate_creation.title="Započnite pravljenje segmenta"
mautic.producttour.segments.initiate_creation.text="Kliknite na \"Novo\" da dodate segment. Na primer, možete pratiti kontakte koji su posetili kontakt stranicu vašeg sajta."
mautic.producttour.segments.internal_name.title="Definišite interni naziv"
mautic.producttour.segments.internal_name.text="Biće vidljiv samo vama i drugim korisnicima Mautic-a na stranici segmenata."
mautic.producttour.segments.customer_facing_name.title="Podesite naziv segmenta za korisnike"
mautic.producttour.segments.customer_facing_name.text="Koristite ovo polje da kontaktima prikažete drugi naziv. Kasnije može biti koristan u centru za podešavanja kako bi upravljali članstvom u segmentu."
mautic.producttour.segments.activate.title="Aktivirajte segment"
mautic.producttour.segments.activate.text="Postavite segment kao aktivan da biste ga kasnije koristili."
mautic.producttour.segments.begin_setup.title="Započnite podešavanje segmenta"
mautic.producttour.segments.begin_setup.text="Dodavanjem filtera pravite dinamičke segmente koji automatski dodaju i uklanjaju kontakte. Preskočite ovaj korak ako segment treba da ostane statičan."
mautic.producttour.segments.select_criteria.title="Izaberite kriterijume segmenta"
mautic.producttour.segments.select_criteria.text="Možete filtrirati na osnovu poznatih informacija i ponašanja. Na primer, koristite \"Posećeni URL\" da dodate kontakte koji su otvorili određenu stranicu."
mautic.producttour.segments.combine_filters.title="Kombinujte filtere segmenta"
mautic.producttour.segments.combine_filters.text="Za više filtera izaberite dodatna polja i odredite da li se koriste izrazi \"I\" ili \"ILI\"."
mautic.producttour.segments.good_to_go.title="Sve je spremno"
mautic.producttour.segments.good_to_go.text="Napravili ste segment. Sačuvajte ga da biste završili."
mautic.producttour.campaigns.welcome.title="Dobro došli u centralu kampanja"
mautic.producttour.campaigns.welcome.text="Ovde upravljate procesima marketinške automatizacije u Mautic-u."
mautic.producttour.emails.craft.title="Napravite odlične imejlove"
mautic.producttour.emails.craft.text="Ovde možete lako da pravite, prilagođavate i pratite imejl komunikaciju."
mautic.producttour.messages.hub.title="Vaš centar za višekanalne poruke"
mautic.producttour.messages.hub.text="Ovde pravite i upravljate personalizovanim marketinškim porukama kroz više kanala. Organizujte slanje SMS-a, imejlova, poruka na društvenim mrežama i push obaveštenja."
mautic.producttour.focus.capture_attention.title="Privucite pažnju fokus elementima"
mautic.producttour.focus.capture_attention.text="Fokus elementi omogućavaju pravljenje iskačućih prozora, modala i banera koji privlače pažnju i podstiču radnje poput prijave na bilten ili popunjavanja obrasca."
mautic.producttour.assets.manage.title="Upravljajte digitalnim resursima"
mautic.producttour.assets.manage.text="Ovo je centralno mesto za upravljanje svim digitalnim resursima u vašim marketinškim kampanjama."
mautic.producttour.forms.design.title="Oblikujte alate za prikupljanje podataka"
mautic.producttour.forms.design.text="Ovde možete da pravite i upravljate obrascima za efikasno prikupljanje vrednih podataka o klijentima."
mautic.producttour.landing_pages.create.title="Napravite privlačne odredišne stranice"
mautic.producttour.landing_pages.create.text="Ovde lako dizajnirate, prilagođavate i optimizujete odredišne stranice. Mautic alat za prevlačenje omogućava dodavanje slika, obrazaca i CTA elemenata radi privlačenja klijenata i boljih konverzija."
mautic.producttour.dynamic_content.personalize.title="Dinamički personalizujte sadržaj"
mautic.producttour.dynamic_content.personalize.text="Pravite personalizovana iskustva isporučivanjem sadržaja prilagođenog ponašanju i interesovanjima publike. Dinamički prilagodite sadržaj sajta, imejlove i odredišne stranice."
mautic.producttour.point_actions.automated_responses.title="Podesite automatizovane odgovore"
mautic.producttour.point_actions.automated_responses.text="Definišite i automatizujte odgovore na interakcije u marketinškim kampanjama, poput naknadnih imejlova, podešavanja poena klijenta ili dodavanja kontakata u segmente."
mautic.producttour.point_triggers.configure.title="Podesite marketinške okidače"
mautic.producttour.point_triggers.configure.text="Automatizujte manje tokove rada akcijama koje reaguju na ponašanje i događaje, poput slanja obrazaca, otvaranja imejlova ili poseta stranicama."
mautic.producttour.point_groups.organize.title="Organizujte strategije poena"
mautic.producttour.point_groups.organize.text="Grupe pomažu da organizujete poene i upravljate strategijama za više publika. Tako možete da razlikujete pokazatelje angažovanja."
mautic.producttour.stages.map_journey.title="Mapirajte put korisnika"
mautic.producttour.stages.map_journey.text="Ovde definišete i upravljate fazama životnog ciklusa klijenta. Organizovanjem klijenata po fazama možete primeniti ciljane strategije i personalizovati komunikaciju."
mautic.producttour.reports.gain_insights.title="Pronađite uvide u podacima"
mautic.producttour.reports.gain_insights.text="Ovaj odeljak omogućava pravljenje, prilagođavanje i analizu izveštaja. Pratite učinak kampanja, angažovanje putem imejla, privlačenje klijenata i još mnogo toga."
mautic.producttour.tags.organize_contacts.title="Organizujte kontakte pomoću oznaka"
mautic.producttour.tags.organize_contacts.text="Oznake su prilagodljivi nazivi koje možete dodeliti kontaktima u Mautic-u. Olakšavaju segmentaciju i ciljani marketing, kao i filtriranje i pretragu grupa kontakata."
