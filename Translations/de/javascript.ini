mautic.producttour.button.back="Zurück"
mautic.producttour.button.finish="Fertig"
mautic.producttour.button.go_to_configuration="Zur Konfiguration"
mautic.producttour.button.go_to_tracking_settings="Zu den Tracking-Einstellungen"
mautic.producttour.button.go_to_contacts="Zu den Kontakten"
mautic.producttour.dashboard.welcome.title="Willkommen bei Mautic"
mautic.producttour.dashboard.welcome.text="Dies ist Ihr Dashboard. Folgen Sie der Tour, um loszulegen und zu erfahren, wie die Funktionen arbeiten."
mautic.producttour.dashboard.filter.title="Dashboard-Daten filtern"
mautic.producttour.dashboard.filter.text="Standardmäßig zeigt Mautic Daten der letzten 30 Tage an. Sie können dies in der Konfiguration ändern; die Einstellung gilt für alle Widgets."
mautic.producttour.dashboard.widgets.title="Wichtige Informationen mit Widgets anzeigen"
mautic.producttour.dashboard.widgets.text="Diese Diagramme zeigen Ihre Daten. Sobald Informationen gesammelt werden, können Sie sie hier erneut prüfen."
mautic.producttour.dashboard.navigation.title="In Mautic navigieren"
mautic.producttour.dashboard.navigation.text="Über das Hauptmenü können Sie die verschiedenen Funktionen einfach aufrufen und erkunden."
mautic.producttour.dashboard.tracking.title="Tracking-Skript verbinden"
mautic.producttour.dashboard.tracking.text="Um Besucherdaten zu sammeln, öffnen Sie die Konfiguration und richten Sie Ihr Tracking-Skript ein."
mautic.producttour.configuration.visitor_tracking.title="Besucher-Tracking konfigurieren"
mautic.producttour.configuration.visitor_tracking.text="Auf dieser Seite verwalten Sie die Funktionsweise von Mautic. Zuerst stellen wir sicher, dass Besucher erfasst werden können."
mautic.producttour.configuration.implement_tracking.title="Tracking auf Ihrer Website einrichten"
mautic.producttour.configuration.implement_tracking.text="Kopieren Sie diesen Code und fügen Sie ihn am Ende des Body-Tags Ihrer Website ein."
mautic.producttour.configuration.grow_list.title="Ihre Liste erweitern"
mautic.producttour.configuration.grow_list.text="Sobald Personen Ihre Website besuchen, finden Sie neue Besucher auf Ihrer Kontaktseite."
mautic.producttour.contacts.explore_database.title="Ihre Kontaktdatenbank erkunden"
mautic.producttour.contacts.explore_database.text="Nachdem Sie den Mautic-Tracking-Code eingerichtet haben, sehen Sie alle unbekannten und bekannten Besucher, die mit Ihrer Website interagieren. Importieren Sie eigene Kontakte, um diese Liste zu füllen oder zu erweitern."
mautic.producttour.contacts.toggle_anonymous.title="Anonyme Kontakte umschalten"
mautic.producttour.contacts.toggle_anonymous.text="Mautic erstellt anhand der IP-Adresse unbekannte Besucher, für die noch kein Name oder keine E-Mail-Adresse vorliegt. Klicken Sie später, um zwischen unbekannten Besuchern (anonymen Kontakten) und bekannten Besuchern (Kontakten) umzuschalten."
mautic.producttour.contacts.import.title="Ihre Kontakte importieren"
mautic.producttour.contacts.import.text="Klicken Sie auf die Pfeilschaltfläche, öffnen Sie das Menü und wählen Sie \"Import\", um Leads schnell zu importieren, oder \"Importverlauf\", um frühere Importe anzuzeigen."
mautic.producttour.segments.understand.title="Kontaktsegmentierung verstehen"
mautic.producttour.segments.understand.text="Segmente werden verwendet, um Kontakte anhand ihrer Eigenschaften, ihres Verhaltens oder ihrer Kampagnenteilnahme in bestimmte Listen einzuordnen."
mautic.producttour.segments.initiate_creation.title="Segmenterstellung beginnen"
mautic.producttour.segments.initiate_creation.text="Klicken Sie auf \"Neu\", um ein Segment hinzuzufügen. Sie können beispielsweise Kontakte beobachten, die die Kontaktseite Ihrer Website besucht haben."
mautic.producttour.segments.internal_name.title="Internen Namen festlegen"
mautic.producttour.segments.internal_name.text="Dieser Name ist nur für Sie und andere Mautic-Benutzer auf der Segmentseite sichtbar."
mautic.producttour.segments.customer_facing_name.title="Öffentlichen Segmentnamen festlegen"
mautic.producttour.segments.customer_facing_name.text="Verwenden Sie dieses Feld, um Kontakten einen anderen Namen anzuzeigen. Im Präferenzzentrum können sie damit später ihre Segmentzugehörigkeit verwalten."
mautic.producttour.segments.activate.title="Segment aktivieren"
mautic.producttour.segments.activate.text="Setzen Sie das Segment auf Aktiv, damit Sie es später verwenden können."
mautic.producttour.segments.begin_setup.title="Segment einrichten"
mautic.producttour.segments.begin_setup.text="Mit Filtern erstellen Sie dynamische Segmente, die Kontakte automatisch hinzufügen und entfernen. Überspringen Sie diesen Schritt, wenn das Segment statisch bleiben soll."
mautic.producttour.segments.select_criteria.title="Segmentkriterien auswählen"
mautic.producttour.segments.select_criteria.text="Sie können nach bekannten Informationen und Verhalten filtern. Verwenden Sie beispielsweise \"Besuchte URL\", um Kontakte hinzuzufügen, die eine bestimmte Seite aufgerufen haben."
mautic.producttour.segments.combine_filters.title="Segmentfilter kombinieren"
mautic.producttour.segments.combine_filters.text="Wählen Sie für mehrere Filter zusätzliche Felder aus und legen Sie fest, ob die Filter mit \"UND\" oder \"ODER\" verknüpft werden."
mautic.producttour.segments.good_to_go.title="Bereit"
mautic.producttour.segments.good_to_go.text="Sie haben ein Segment erstellt. Speichern Sie es, um den Vorgang abzuschließen."
mautic.producttour.campaigns.welcome.title="Willkommen in Ihrer Kampagnenzentrale"
mautic.producttour.campaigns.welcome.text="Hier verwalten und steuern Sie Ihre Marketing-Automatisierungsprozesse in Mautic."
mautic.producttour.emails.craft.title="Beeindruckende E-Mails erstellen"
mautic.producttour.emails.craft.text="Hier können Sie Ihre E-Mail-Kommunikation einfach erstellen, anpassen und verfolgen."
mautic.producttour.messages.hub.title="Ihre Zentrale für Multichannel-Nachrichten"
mautic.producttour.messages.hub.text="Hier erstellen und verwalten Sie personalisierte Marketingnachrichten über mehrere Kanäle. Sie können den Versand von SMS, E-Mails, Social Media und Push-Benachrichtigungen organisieren."
mautic.producttour.focus.capture_attention.title="Mit Focus-Elementen Aufmerksamkeit gewinnen"
mautic.producttour.focus.capture_attention.text="Mit Focus-Elementen erstellen Sie Pop-ups, Modalfenster und Banner, die Aufmerksamkeit erzeugen und zu Aktionen wie Newsletter-Anmeldung oder dem Ausfüllen eines Formulars anregen."
mautic.producttour.assets.manage.title="Ihre digitalen Inhalte verwalten"
mautic.producttour.assets.manage.text="Dies ist Ihre zentrale Stelle zur Verwaltung aller digitalen Inhalte für Ihre Marketingkampagnen."
mautic.producttour.forms.design.title="Werkzeuge zur Datenerfassung gestalten"
mautic.producttour.forms.design.text="Hier können Sie Formulare erstellen und verwalten, um wertvolle Kundendaten effektiv zu erfassen."
mautic.producttour.landing_pages.create.title="Überzeugende Landingpages erstellen"
mautic.producttour.landing_pages.create.text="Hier entwerfen, gestalten und optimieren Sie Landingpages. Mit Mautics intuitivem Drag-and-drop-Builder fügen Sie mühelos Bilder, Formulare und CTAs hinzu, um Leads zu gewinnen und Conversions zu steigern."
mautic.producttour.dynamic_content.personalize.title="Inhalte dynamisch personalisieren"
mautic.producttour.dynamic_content.personalize.text="Hier erstellen Sie personalisierte Erlebnisse, indem Sie Inhalte anhand des Verhaltens und der Präferenzen Ihrer Zielgruppe anpassen. Personalisieren Sie Website-Inhalte, E-Mails und Landingpages dynamisch."
mautic.producttour.point_actions.automated_responses.title="Automatisierte Antworten einrichten"
mautic.producttour.point_actions.automated_responses.text="Hier definieren und automatisieren Sie Antworten auf Benutzerinteraktionen in Ihren Marketingkampagnen, etwa Folge-E-Mails, Lead-Bewertungen oder die Zuordnung zu Segmenten."
mautic.producttour.point_triggers.configure.title="Marketing-Trigger konfigurieren"
mautic.producttour.point_triggers.configure.text="Automatisieren Sie kleinere Abläufe mit Aktionen, die auf Benutzerverhalten und Ereignisse reagieren, etwa Formularübermittlungen, E-Mail-Öffnungen oder Seitenaufrufe."
mautic.producttour.point_groups.organize.title="Ihre Punktestrategien organisieren"
mautic.producttour.point_groups.organize.text="Gruppen helfen Ihnen, Punkte zu ordnen und Strategien für mehrere Zielgruppen zu verwalten. So können Sie Engagement-Kennzahlen besser unterscheiden."
mautic.producttour.stages.map_journey.title="Ihre Customer Journey abbilden"
mautic.producttour.stages.map_journey.text="Hier definieren und verwalten Sie die verschiedenen Phasen des Kundenlebenszyklus. Durch die Organisation von Leads in Phasen können Sie gezielte Marketingstrategien und personalisierte Kommunikation umsetzen."
mautic.producttour.reports.gain_insights.title="Erkenntnisse aus Ihren Daten gewinnen"
mautic.producttour.reports.gain_insights.text="In diesem Bereich erstellen, gestalten und analysieren Sie verschiedenste Berichte. Verfolgen Sie Kennzahlen wie Kampagneneffektivität, E-Mail-Engagement und Lead-Generierung."
mautic.producttour.tags.organize_contacts.title="Kontakte mit Tags organisieren"
mautic.producttour.tags.organize_contacts.text="Tags sind anpassbare Bezeichnungen für Kontakte in Mautic. Sie erleichtern Segmentierung und zielgerichtetes Marketing. Erstellen, bearbeiten und verwalten Sie Tags, um bestimmte Gruppen zu filtern und zu suchen."
