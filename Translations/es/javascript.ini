mautic.producttour.button.next="Siguiente"
mautic.producttour.button.back="Atrás"
mautic.producttour.button.finish="Finalizar"
mautic.producttour.button.go_to_configuration="Ir a la configuración"
mautic.producttour.button.go_to_tracking_settings="Ir a la configuración del seguimiento"
mautic.producttour.button.go_to_contacts="Ir a los contactos"
mautic.producttour.dashboard.welcome.title="Bienvenido a Mautic"
mautic.producttour.dashboard.welcome.text="Este es tu panel. Sigue el recorrido para empezar y aprender cómo funcionan las funciones."
mautic.producttour.dashboard.filter.title="Filtrar los datos del panel"
mautic.producttour.dashboard.filter.text="De forma predeterminada, Mautic muestra los datos de los últimos 30 días, pero puedes cambiarlo en la configuración. Se aplica a todos los widgets."
mautic.producttour.dashboard.widgets.title="Consulta información esencial con widgets"
mautic.producttour.dashboard.widgets.text="Estos gráficos muestran tus datos. Cuando empieces a recopilar información, vuelve a consultarlos."
mautic.producttour.dashboard.navigation.title="Navegar por Mautic"
mautic.producttour.dashboard.navigation.text="El menú principal te permite acceder y explorar fácilmente las distintas funciones."
mautic.producttour.dashboard.tracking.title="Conectar el script de seguimiento"
mautic.producttour.dashboard.tracking.text="Para empezar a recopilar datos de visitantes, abre la configuración y configura el script de seguimiento."
mautic.producttour.configuration.visitor_tracking.title="Configurar el seguimiento de visitantes"
mautic.producttour.configuration.visitor_tracking.text="En esta página puedes gestionar el funcionamiento de Mautic. Primero, asegúrate de que podemos hacer seguimiento de los visitantes."
mautic.producttour.configuration.implement_tracking.title="Implementar el seguimiento en tu sitio web"
mautic.producttour.configuration.implement_tracking.text="Copia este código y pégalo al final de la etiqueta body de tu sitio web."
mautic.producttour.configuration.grow_list.title="Haz crecer tu lista"
mautic.producttour.configuration.grow_list.text="Cuando las personas empiecen a visitar tu sitio web, encontrarás nuevos visitantes en la página Contactos."
mautic.producttour.contacts.explore_database.title="Explora tu base de contactos"
mautic.producttour.contacts.explore_database.text="Después de implementar el código de seguimiento de Mautic, podrás ver los visitantes identificados y no identificados que interactúan con tu sitio. Importa tus propios contactos para completar o ampliar esta lista."
mautic.producttour.contacts.toggle_anonymous.title="Alternar contactos anónimos"
mautic.producttour.contacts.toggle_anonymous.text="Mautic crea visitantes no identificados según su IP cuando aún no tenemos su nombre o correo electrónico. Haz clic después para alternar entre visitantes no identificados (contactos anónimos) y conocidos (contactos)."
mautic.producttour.contacts.import.title="Importa tus contactos"
mautic.producttour.contacts.import.text="Haz clic en el botón de flecha para abrir el menú y elige \"Importar\" para traer clientes potenciales rápidamente o \"Historial de importaciones\" para consultar importaciones anteriores."
mautic.producttour.segments.understand.title="Comprende la segmentación de contactos"
mautic.producttour.segments.understand.text="Los segmentos se utilizan para clasificar tus contactos en listas según sus atributos, comportamiento o participación en campañas."
mautic.producttour.segments.initiate_creation.title="Inicia la creación de un segmento"
mautic.producttour.segments.initiate_creation.text="Haz clic en \"Nuevo\" para añadir un segmento. Por ejemplo, puedes controlar los contactos que visitaron la página de contacto de tu sitio."
mautic.producttour.segments.internal_name.title="Define el nombre interno"
mautic.producttour.segments.internal_name.text="Solo tú y otros usuarios de Mautic podrán verlo en la página de segmentos."
mautic.producttour.segments.customer_facing_name.title="Define el nombre visible para los contactos"
mautic.producttour.segments.customer_facing_name.text="Usa este campo para mostrar otro nombre a los contactos. Más adelante será útil en el centro de preferencias para gestionar su pertenencia al segmento."
mautic.producttour.segments.activate.title="Activa el segmento"
mautic.producttour.segments.activate.text="Asegúrate de marcar el segmento como Activo para utilizarlo más adelante."
mautic.producttour.segments.begin_setup.title="Empieza a configurar el segmento"
mautic.producttour.segments.begin_setup.text="Al añadir filtros puedes crear segmentos dinámicos que agregan y eliminan contactos automáticamente. Omite este paso para mantenerlo estático."
mautic.producttour.segments.select_criteria.title="Selecciona los criterios del segmento"
mautic.producttour.segments.select_criteria.text="Puedes filtrar según información conocida y comportamiento. Por ejemplo, usa \"URL visitada\" para añadir contactos que accedieron a una página concreta."
mautic.producttour.segments.combine_filters.title="Combina los filtros del segmento"
mautic.producttour.segments.combine_filters.text="Para varios filtros, selecciona campos adicionales e indica si deben usar las expresiones \"Y\" o \"O\"."
mautic.producttour.segments.good_to_go.title="Todo listo"
mautic.producttour.segments.good_to_go.text="Has creado un segmento. Guárdalo para terminar."
mautic.producttour.campaigns.welcome.title="Bienvenido a tu centro de campañas"
mautic.producttour.campaigns.welcome.text="Aquí gestionarás y dirigirás tus procesos de automatización de marketing en Mautic."
mautic.producttour.emails.craft.title="Crea obras maestras de correo electrónico"
mautic.producttour.emails.craft.text="Aquí puedes crear, personalizar y hacer seguimiento de tus comunicaciones por correo fácilmente."
mautic.producttour.messages.hub.title="Tu centro de mensajería multicanal"
mautic.producttour.messages.hub.text="Este es tu espacio para crear y gestionar mensajes de marketing personalizados en varios canales. Organiza envíos de SMS, correo, redes sociales y notificaciones push."
mautic.producttour.focus.capture_attention.title="Capta la atención con elementos Focus"
mautic.producttour.focus.capture_attention.text="Los elementos Focus permiten crear ventanas emergentes, modales y banners para captar la atención y fomentar acciones como suscribirse a un boletín o completar un formulario."
mautic.producttour.assets.manage.title="Gestiona tus recursos digitales"
mautic.producttour.assets.manage.text="Este es el centro para gestionar todos los recursos digitales utilizados en tus campañas de marketing."
mautic.producttour.forms.design.title="Diseña tus herramientas de recopilación de datos"
mautic.producttour.forms.design.text="Aquí puedes crear y gestionar formularios para recopilar datos valiosos de clientes de forma eficaz."
mautic.producttour.landing_pages.create.title="Crea páginas de destino atractivas"
mautic.producttour.landing_pages.create.text="Aquí puedes diseñar, personalizar y optimizar páginas de destino. El intuitivo editor de arrastrar y soltar de Mautic permite añadir imágenes, formularios y CTA para captar clientes potenciales y aumentar las conversiones."
mautic.producttour.dynamic_content.personalize.title="Personaliza tu contenido dinámicamente"
mautic.producttour.dynamic_content.personalize.text="Crea experiencias personalizadas ofreciendo contenido adaptado al comportamiento y las preferencias de tu audiencia. Personaliza dinámicamente el contenido web, los correos y las páginas de destino."
mautic.producttour.point_actions.automated_responses.title="Configura respuestas automatizadas"
mautic.producttour.point_actions.automated_responses.text="Define y automatiza respuestas a las interacciones en tus campañas, como correos de seguimiento, ajustes de puntuación o incorporación de contactos a segmentos."
mautic.producttour.point_triggers.configure.title="Configura tus activadores de marketing"
mautic.producttour.point_triggers.configure.text="Automatiza flujos pequeños con acciones que respondan al comportamiento y los eventos, como envíos de formularios, aperturas de correos o visitas a páginas."
mautic.producttour.point_groups.organize.title="Organiza tus estrategias de puntos"
mautic.producttour.point_groups.organize.text="Los grupos te ayudan a organizar puntos y gestionar estrategias para varias audiencias, de modo que puedas diferenciar las métricas de interacción."
mautic.producttour.stages.map_journey.title="Traza el recorrido del cliente"
mautic.producttour.stages.map_journey.text="Aquí defines y gestionas las etapas del ciclo de vida del cliente. Al organizar los clientes potenciales por etapas, puedes aplicar estrategias específicas y personalizar las comunicaciones."
mautic.producttour.reports.gain_insights.title="Obtén información de tus datos"
mautic.producttour.reports.gain_insights.text="Esta sección permite crear, personalizar y analizar informes. Sigue métricas como la eficacia de las campañas, la interacción con el correo y la generación de clientes potenciales."
mautic.producttour.tags.organize_contacts.title="Organiza contactos con etiquetas"
mautic.producttour.tags.organize_contacts.text="Las etiquetas son nombres personalizables que puedes aplicar a los contactos en Mautic. Facilitan la segmentación y el marketing dirigido, además de filtrar y buscar grupos concretos."
