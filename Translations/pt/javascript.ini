mautic.producttour.button.next="Seguinte"
mautic.producttour.button.back="Voltar"
mautic.producttour.button.finish="Concluir"
mautic.producttour.button.go_to_configuration="Ir para a configuração"
mautic.producttour.button.go_to_tracking_settings="Ir para as definições de rastreamento"
mautic.producttour.button.go_to_contacts="Ir para os contactos"
mautic.producttour.dashboard.welcome.title="Bem-vindo ao Mautic"
mautic.producttour.dashboard.welcome.text="Este é o seu painel. Siga o tour para começar e aprender como funcionam as funcionalidades."
mautic.producttour.dashboard.filter.title="Filtrar os dados do painel"
mautic.producttour.dashboard.filter.text="Por predefinição, o Mautic mostra os dados dos últimos 30 dias, mas pode alterar isto na configuração. A alteração aplica-se a todos os widgets."
mautic.producttour.dashboard.widgets.title="Veja informações essenciais com widgets"
mautic.producttour.dashboard.widgets.text="Estes gráficos apresentam os seus dados. Assim que começar a recolher informação, volte a consultá-los."
mautic.producttour.dashboard.navigation.title="Navegar no Mautic"
mautic.producttour.dashboard.navigation.text="O menu principal permite aceder e explorar facilmente as várias funcionalidades."
mautic.producttour.dashboard.tracking.title="Ligar o script de rastreamento"
mautic.producttour.dashboard.tracking.text="Para começar a recolher dados dos visitantes, abra a configuração e configure o script de rastreamento."
mautic.producttour.configuration.visitor_tracking.title="Configurar o rastreamento de visitantes"
mautic.producttour.configuration.visitor_tracking.text="Nesta página pode gerir o funcionamento do Mautic. Primeiro, vamos garantir que conseguimos rastrear os visitantes."
mautic.producttour.configuration.implement_tracking.title="Implementar o rastreamento no seu site"
mautic.producttour.configuration.implement_tracking.text="Copie este código e cole-o no fim da etiqueta body do seu site."
mautic.producttour.configuration.grow_list.title="Faça crescer a sua lista"
mautic.producttour.configuration.grow_list.text="Quando as pessoas começarem a visitar o seu site, encontrará novos visitantes na página Contactos."
mautic.producttour.contacts.explore_database.title="Explore a sua base de contactos"
mautic.producttour.contacts.explore_database.text="Depois de implementar o código de rastreamento do Mautic, poderá ver os visitantes identificados e não identificados que interagem com o seu site. Importe os seus contactos para preencher ou ampliar esta lista."
mautic.producttour.contacts.toggle_anonymous.title="Alternar contactos anónimos"
mautic.producttour.contacts.toggle_anonymous.text="O Mautic cria visitantes não identificados com base no IP quando ainda não temos o nome ou o e-mail. Clique mais tarde para alternar entre visitantes não identificados (contactos anónimos) e conhecidos (contactos)."
mautic.producttour.contacts.import.title="Importe os seus contactos"
mautic.producttour.contacts.import.text="Clique no botão com a seta para abrir o menu e escolha \"Importar\" para adicionar leads rapidamente ou \"Histórico de importações\" para consultar importações anteriores."
mautic.producttour.segments.understand.title="Compreenda a segmentação de contactos"
mautic.producttour.segments.understand.text="Os segmentos servem para classificar os seus contactos em listas com base nos atributos, comportamento ou participação em campanhas."
mautic.producttour.segments.initiate_creation.title="Comece a criar um segmento"
mautic.producttour.segments.initiate_creation.text="Clique em \"Novo\" para adicionar um segmento. Por exemplo, pode acompanhar os contactos que visitaram a página de contacto do seu site."
mautic.producttour.segments.internal_name.title="Defina o nome interno"
mautic.producttour.segments.internal_name.text="Será visível apenas para si e para outros utilizadores do Mautic na página de segmentos."
mautic.producttour.segments.customer_facing_name.title="Defina o nome do segmento para os clientes"
mautic.producttour.segments.customer_facing_name.text="Use este campo para mostrar outro nome aos contactos. Mais tarde, será útil no centro de preferências para gerirem a participação no segmento."
mautic.producttour.segments.activate.title="Ative o segmento"
mautic.producttour.segments.activate.text="Defina o segmento como Ativo para o poder utilizar mais tarde."
mautic.producttour.segments.begin_setup.title="Comece a configurar o segmento"
mautic.producttour.segments.begin_setup.text="Ao adicionar filtros, pode criar segmentos dinâmicos que adicionam e removem contactos automaticamente. Ignore este passo para manter o segmento estático."
mautic.producttour.segments.select_criteria.title="Selecione os critérios do segmento"
mautic.producttour.segments.select_criteria.text="Pode filtrar com base em informação conhecida e comportamento. Por exemplo, use \"URL visitado\" para adicionar contactos que acederam a uma página específica."
mautic.producttour.segments.combine_filters.title="Combine os filtros do segmento"
mautic.producttour.segments.combine_filters.text="Para vários filtros, selecione campos adicionais e indique se devem usar as expressões \"E\" ou \"OU\"."
mautic.producttour.segments.good_to_go.title="Está tudo pronto"
mautic.producttour.segments.good_to_go.text="Criou um segmento. Guarde-o para concluir."
mautic.producttour.campaigns.welcome.title="Bem-vindo ao centro das suas campanhas"
mautic.producttour.campaigns.welcome.text="Aqui gere e controla os seus processos de automatização de marketing no Mautic."
mautic.producttour.emails.craft.title="Crie e-mails excelentes"
mautic.producttour.emails.craft.text="Aqui pode criar, personalizar e acompanhar facilmente as suas comunicações por e-mail."
mautic.producttour.messages.hub.title="O seu centro de mensagens multicanal"
mautic.producttour.messages.hub.text="Este é o seu espaço para criar e gerir mensagens de marketing personalizadas em vários canais. Organize o envio de SMS, e-mails, mensagens sociais e notificações push."
mautic.producttour.focus.capture_attention.title="Capte a atenção com elementos Focus"
mautic.producttour.focus.capture_attention.text="Os elementos Focus permitem criar pop-ups, modais e banners para captar a atenção e incentivar ações como subscrever uma newsletter ou preencher um formulário."
mautic.producttour.assets.manage.title="Gira os seus recursos digitais"
mautic.producttour.assets.manage.text="Este é o centro para gerir todos os recursos digitais utilizados nas suas campanhas de marketing."
mautic.producttour.forms.design.title="Crie ferramentas de recolha de dados"
mautic.producttour.forms.design.text="Aqui pode criar e gerir formulários para recolher eficazmente dados valiosos dos clientes."
mautic.producttour.landing_pages.create.title="Crie páginas de destino apelativas"
mautic.producttour.landing_pages.create.text="Aqui pode criar, personalizar e otimizar páginas de destino. O editor intuitivo de arrastar e largar do Mautic permite adicionar imagens, formulários e CTAs para captar leads e aumentar as conversões."
mautic.producttour.dynamic_content.personalize.title="Personalize dinamicamente o conteúdo"
mautic.producttour.dynamic_content.personalize.text="Crie experiências personalizadas com conteúdo adaptado ao comportamento e às preferências do público. Personalize dinamicamente o conteúdo do site, os e-mails e as páginas de destino."
mautic.producttour.point_actions.automated_responses.title="Configure respostas automatizadas"
mautic.producttour.point_actions.automated_responses.text="Defina e automatize respostas às interações nas campanhas, como e-mails de acompanhamento, ajustes da pontuação ou adição de contactos a segmentos."
mautic.producttour.point_triggers.configure.title="Configure os seus acionadores de marketing"
mautic.producttour.point_triggers.configure.text="Automatize pequenos fluxos com ações que respondem ao comportamento e a eventos, como envios de formulários, aberturas de e-mails ou visitas a páginas."
mautic.producttour.point_groups.organize.title="Organize as suas estratégias de pontos"
mautic.producttour.point_groups.organize.text="Os grupos ajudam a organizar pontos e a gerir estratégias para vários públicos, permitindo distinguir as métricas de interação."
mautic.producttour.stages.map_journey.title="Mapeie a jornada do cliente"
mautic.producttour.stages.map_journey.text="Aqui define e gere as etapas do ciclo de vida do cliente. Ao organizar os leads por etapas, pode aplicar estratégias direcionadas e personalizar as comunicações."
mautic.producttour.reports.gain_insights.title="Obtenha informações dos seus dados"
mautic.producttour.reports.gain_insights.text="Esta secção permite criar, personalizar e analisar relatórios. Acompanhe a eficácia das campanhas, a interação por e-mail, a geração de leads e muito mais."
mautic.producttour.tags.organize_contacts.title="Organize contactos com etiquetas"
mautic.producttour.tags.organize_contacts.text="As etiquetas são nomes personalizáveis que pode aplicar aos contactos no Mautic. Facilitam a segmentação e o marketing direcionado, bem como a filtragem e pesquisa de grupos."
